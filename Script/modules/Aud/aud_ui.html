<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJeTools — Aud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1a1c23;
    --surface:  #22252f;
    --surface2: #2a2d3a;
    --border:   #3a3d4d;
    --accent:   #4f8ef7;
    --accent2:  #7c3aed;
    --green:    #22c55e;
    --red:      #ef4444;
    --text:     #e2e8f0;
    --text2:    #94a3b8;
    --radius:   8px;
    --shadow:   0 4px 20px rgba(0,0,0,.4);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1e2235 0%, #252840 100%);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }

  header .logo {
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }

  header .hec-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 10px;
  }

  header .hec-label { font-size: 11px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

  #hec-time {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    cursor: pointer;
  }

  #hec-time:hover { color: #fff; }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background .4s;
    flex-shrink: 0;
  }
  #status-dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #status-dot.err { background: var(--red);   box-shadow: 0 0 6px var(--red); }

  /* ── Perfil tabs ── */
  .perfis-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .perfil-tab {
    padding: 7px 18px;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    border-bottom: none;
  }

  .perfil-tab:hover { color: var(--text); background: var(--surface2); }
  .perfil-tab.active {
    background: var(--bg);
    color: var(--accent);
    border-color: var(--border);
    border-bottom-color: var(--bg);
  }

  /* ── Seções ── */
  main { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

  .secao { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  .secao-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .secao-header:hover { background: var(--border); }

  .secao-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text2);
  }

  .secao-badge {
    font-size: 10px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 1px 7px;
    font-weight: 700;
  }

  .secao-chevron {
    margin-left: auto;
    font-size: 11px;
    color: var(--text2);
    transition: transform .2s;
  }

  .secao.collapsed .secao-chevron { transform: rotate(-90deg); }
  .secao.collapsed .secao-body    { display: none; }

  .secao-body {
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* ── Botões de template ── */
  .btn-tpl {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }

  .btn-tpl:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(79,142,247,.35);
  }

  .btn-tpl.success {
    background: var(--green) !important;
    border-color: var(--green) !important;
    color: #fff !important;
  }

  .btn-tpl.error {
    background: var(--red) !important;
    border-color: var(--red) !important;
    color: #fff !important;
  }

  /* ── Consultas ── */
  .consulta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  .consulta-label {
    flex: 0 0 70px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
  }

  .consulta-input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: border-color .2s;
  }

  .consulta-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79,142,247,.2);
  }

  .consulta-btn {
    flex: 0 0 76px;
    padding: 6px 4px;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .2s;
  }

  .consulta-btn:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
  .consulta-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: transform .3s ease;
    z-index: 9999;
    white-space: nowrap;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.ok   { border-color: var(--green); color: var(--green); }
  #toast.err  { border-color: var(--red);   color: var(--red); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <span class="logo">⚖ PJeTools Aud</span>
  <div id="status-dot" title="Conexão com Chrome"></div>
  <div class="hec-box">
    <span class="hec-label">HEC</span>
    <span id="hec-time" title="Clique para copiar">--:--</span>
  </div>
</header>

<div class="perfis-bar" id="perfis-bar"></div>
<main id="main-content"></main>
<div id="toast"></div>

const PERFIS = {
                otavio: {
                    title: "Otavio",
                    S1: [{"t": "Instrução", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Prazo de 05 dias para regularização processual.</p><p style=\"text-align:justify;text-indent:3cm;\"><u>CONCILIAÇÃO REJEITADA</u></p><p style=\"text-align:justify;text-indent:3cm;\">Defesa com documentos.</p><p style=\"text-align:justify;text-indent:3cm;\">Concede-se o prazo de 05 dias para o reclamante se manifestar sobre a(s) defesa(s) e documento(s), apontando, inclusive, eventuais diferenças que entende devidas, ainda que por amostragem, sob pena de preclusão, observando os termos do artigo 372 do CPC.</p><p style=\"text-align:justify;text-indent:3cm;\">O Ato Normativo 003626-80.2025.2.00.0000 do CNJ, de setembro de 2025, estipula a obrigatoriedade do registro audiovisual de todas as audiências (arts. 1º e 3º). Nesse sentido, esclareço que a audiência será gravada, com disponibilização de link no acervo eletrônico dos autos, exceto na fase de tratativas de conciliação, ao início e ao final da audiência (CLT, arts. 846 e 850), haja vista a confidencialidade garantida pelo art. 30 da Lei 13.140/15, como aliás já decidiu o TED da OAB/SP (Processo: E-6.115/2023).</p><p style=\"text-align:justify;text-indent:3cm;\">Portanto, os depoimentos prestados na presente audiência serão integralmente gravados, razão pela qual não haverá pelo(a) magistrado (a), a transcrição exata das declarações dos depoentes.</p><p style=\"text-align:justify;text-indent:3cm;\">Havendo interesse de se valer, em razões finais ou para fins recursais, de trechos específicos dos depoimentos, deverão as partes indicar com precisão o nome do arquivo, o minuto e o segundo em que o trecho degravado está registrado. A parte adversa, caso discorde da degravação, deverá apresentar impugnação especificada.</p><p style=\"text-align:justify;text-indent:3cm;\">Oportuno destacar que a gravação da audiência pelas partes e por seus advogados é lícita, independentemente da gravação feita pelo juízo (CPC, art. 367, §§ 5º e 6º), mas deve ser precedida de comunicação e identificação prévia dos envolvidos (Art. 5º, § 1º ato normativo), sendo limitada ao uso processual, sendo EXPRESSAMENTE VEDADA a sua utilização para outras finalidades, notadamente publicações em redes sociais, monetização, transmissões on-line, páginas de internet ou compartilhamentos por meio de aplicativos de mensagens (art. 5º, § 4º, II, B, do referido ato).</p><p style=\"text-align:justify;text-indent:3cm;\">Assim, e considerando ainda que a imagem e a voz humanas são protegidas legal e constitucionalmente contra reproduções não autorizadas pelo titular do direito de personalidade respectivo, ficam as partes advertidas de que o Juízo não autoriza o uso ou a reprodução da imagem e ou da voz de qualquer um dos sujeitos processuais por qualquer meio externo ao processo, físico ou eletrônico, sob pena de responsabilidade civil e criminal dos envolvidos.</p><p style=\"text-align:justify;text-indent:3cm;\">Neste momento, inicia-se a gravação da audiência.<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">Depoimento pessoal do(a) reclamante:\"Que<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">Depoimento pessoal do(a) preposto(a) da &nbsp;1ª reclamada: \"Que</p><p style=\"text-align:justify;text-indent:3cm;\">Testemunha do(a) reclamante, CPF, residente e domiciliada, São Paulo/SP.</p><p style=\"text-align:justify;text-indent:3cm;\">Advertida e compromissada.</p><p style=\"text-align:justify;text-indent:3cm;\">Depoimento: \"</p><p style=\"text-align:justify;text-indent:3cm;\">As partes não pretendem outras provas.</p><p style=\"text-align:justify;text-indent:3cm;\">Após o prazo de réplica, estará encerrada a instrução processual.</p><p style=\"text-align:justify;text-indent:3cm;\">Razões finais em 05 dias.</p><p style=\"text-align:justify;text-indent:3cm;\">Conciliação final rejeitada.</p><p style=\"text-align:justify;text-indent:3cm;\">Designo julgamento para o dia 11/09/26, às 13h__, sendo que as partes serão intimadas da decisão.</p><p style=\"text-align:justify;text-indent:3cm;\">Lida e conferida a ata pelos presentes é dispensada a assinatura das partes e dos respectivos patronos.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às %HEC%.</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "Encerramento s/ oitiva", "h": "<p style=\"text-align:justify;text-indent:3cm;\">As partes dispensam os depoimentos pessoais reciprocamente.</p><p style=\"text-align:justify;text-indent:3cm;\">As partes não têm testemunhas.</p><p style=\"text-align:justify;text-indent:3cm;\">Fica preclusa a produção de prova oral.</p><p style=\"text-align:justify;text-indent:3cm;\">Designa-se audiência de JULGAMENTO para o dia 25/09/2026 às 13:__ horas, dispensado o comparecimento das partes e procuradores.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às %HEC%.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "revelia", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Diante da ausência injustificada da reclamada, aplico-lhe a pena de revelia e confissão.</p>"}, {"t": "Dispensa Testemunha", "h": "<p style=\"text-align:justify;text-indent:3cm;\">O reclamante requer a oitiva da testemunha **** , com o intuito de comprovar a existência de vínculo de emprego.</p><p style=\"text-align:justify;text-indent:3cm;\">No particular, considero desnecessária a oitiva da testemunha, porquanto os depoimentos pessoais das partes são convergentes entre si, praticamente uníssonos, dirimindo a controvérsia sobre as questões de fato que abarcam o presente processo. Por conta disso, indefiro o depoimento. Protestos.</p>"}],
                    S3: [{"t": "provimento", "h": "<p style=\"text-align:justify;text-indent:3cm;\">O(a) advogado(a) do(a) * requer o adiamento da presente audiência, tendo em vista que a(s) testemunha(s) *, embora convidada(s), não compareceu(ram).&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">O advogado requer que a intimação seja feita na forma do Provimento.</p><p style=\"text-align:justify;text-indent:3cm;\">Deferido.</p><p style=\"text-align:justify;text-indent:3cm;\"><u>Designa-se nova audiência UNA para o dia /11/26, às * horas, mantendo-se as cominações anteriores.&nbsp;</u></p><p style=\"text-align:justify;text-indent:3cm;\">Servirá o presente como MANDADO DE INTIMAÇÃO DE TESTEMUNHA, comprometendo-se o(a) * a entregar à testemunha acima indicada.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">A ausência ensejará multa e condução coercitiva. Local: Av. Guido Caloi, 1000, Santo Amaro, São Paulo/SP, CEP 05802-140.</p><p style=\"text-align:justify;text-indent:3cm;\">Saem cientes &nbsp;da nova designação as seguintes testemunhas:</p><p style=\"text-align:justify;text-indent:3cm;\">-Do reclamante -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">-Da reclamada -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">As demais testemunhas virão independentemente de notificação, sob pena de preclusão.</p><p style=\"text-align:justify;text-indent:3cm;\">Lida e conferida a ata pelos presentes é dispensada a assinatura das partes e dos respectivos patronos.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às .</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "Testemunha - independente", "h": "<p style=\"text-align:justify;text-indent:3cm;\">&nbsp;INCONCILIADOS.</p><p style=\"text-align:justify;text-indent:3cm;\">O(a) advogado(a) do(a) * requer o adiamento da presente audiência, tendo em vista que a(s) testemunha(s) *, embora convidada(s), não compareceu(ram), comprometendo-se a trazê-la(s) na próxima sessão independentemente de intimação, sob pena de preclusão.</p><p style=\"text-align:justify;text-indent:3cm;\">Defiro.</p><p style=\"text-align:justify;text-indent:3cm;\"><u>Designa-se nova audiência UNA para o dia /11/26, às * horas, mantendo-se as cominações anteriores.&nbsp;</u></p><p style=\"text-align:justify;text-indent:3cm;\">Saem cientes da nova designação as seguintes testemunhas:</p><p style=\"text-align:justify;text-indent:3cm;\">-Do reclamante -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">-Da reclamada -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">As demais testemunhas virão independentemente de notificação, sob pena de preclusão.</p><p style=\"text-align:justify;text-indent:3cm;\">Lida e conferida a ata pelos presentes é dispensada a assinatura das partes e dos respectivos patronos.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às %HEC%.</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}],
                    S4: [{"t": "Alvará", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A presente ata tem força de ALVARÁ perante a CEF para liberação do FGTS, assim como suprimindo a inexistência do Termo de Rescisão do Contrato de Trabalho/CD, dos recolhimentos rescisórios do FGTS e do carimbo de baixa da CTPS, fornecendo-se, inclusive, os seguintes elementos relativos ao contrato de trabalho: PIS nº: *, data de admissão: * e demissão: *, CNPJ: *. CTPS * Série *-SP tipo de rescisão do contrato de trabalho::<u>****</u></p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A presente ata possui força de ALVARÁ perante a CEF, SINE e demais órgãos competentes para requerimento do seguro-desemprego, suprindo, inclusive, a inexistência do TRCT, das guias SD/CD e do carimbo de baixa da CTPS, caso os prazos de carência e eventuais solicitações anteriores forem atendidas. PIS nº: * , data de admissão: * e demissão: *, CNPJ: * CTPS * Série *-SP&nbsp; tipo de rescisão do contrato de trabalho:<u>****</u></p>"}, {"t": "Suspender subsidiária", "h": "<p style=\"text-align:justify;text-indent:3cm;\">A segunda reclamada não concorda em permanecer no polo responsável pelo acordo e o reclamante não concorda com sua exclusão nesse momento. Assim, o processo ficará suspenso até o cumprimento total do acordo quando a quitação também se dará em relação à segunda reclamada. Uma vez não cumprido o acordo, o processo voltará ao estado em que se encontra com apresentação de defesas e produção de provas. Ficará estipulada multa de 20% sobre o valor do acordo em caso de descumprimento para que não seja utilizado como medida protelatória do feito.</p>"}, {"t": "Acordo - Suspensão +Retorno ao estado anterior", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">As partes, neste ato, ajustam a suspensão do processo <strong>até o dia ******</strong>, data do pagamento da última parcela do acordo.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O(a) reclamante terá o prazo de 15 dias, contado do termo final da suspensão, para noticiar eventual inadimplemento por parte da reclamada, ficando ciente desde já que no seu silêncio considerar-se-ão adimplidas todas as parcelas.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Nessa hipótese, os autos virão conclusos para homologação do acordo e exclusão das demais reclamadas.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Em caso de descumprimento do acordo, o processo retornará ao estado em que se encontrava, isto é, será designada nova audiência ***<strong>UNA / UNA/RS</strong> para recebimento das defesas e instrução do processo, de sorte que eventual valor parcial do acordo quitado será deduzido de futura execução.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Com o pagamento integral do acordo, o(a) reclamante dará geral e plena quitação pelo objeto da inicial e extinto contrato de trabalho.</p>"}, {"t": "acordo subsidiária", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Fica ajustada, ainda, a responsabilidade subsidiária da segunda reclamada, pelo valor integral do acordo na hipótese de inadimplemento por parte da primeira reclamada. Desta feita, caso descumprido o acordo pela primeira reclamada, a segunda reclamada deverá ser intimada para proceder ao pagamento do quanto inadimplido no prazo de 15 dias, observado o valor das parcelas e a sua periodicidade, sendo certo que na hipótese de pagamento tempestivo pela responsável subsidiária não lhe será cobrada multa acima estipulada, sendo que nesse caso a multa será devida exclusivamente pela primeira reclamada</p>"}, {"t": "diverso entre as partes", "h": "<p style=\"text-align:justify;text-indent:3cm;\">As partes ajustam, outrossim, que as primeira/segunda e segunda/terceira reclamadas responderão exclusivamente pelos valores que se comprometeram a pagar, conforme discriminação supra.</p><p style=\"text-align:justify;text-indent:3cm;\">Dessa forma, em caso de inadimplemento, apenas da empresa que der causa ao descumprimento do acordo será cobrada a multa acima prevista, bem como será iniciada a respectiva execução do valor inadimplido.</p>"}, {"t": "INSS s/ vínculo", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Após a quitação do acordo, a reclamada deverá comprovar, em 30 dias, o recolhimento das contribuições previdenciárias relacionadas ao item b da discriminação, na forma do Tema 310 do TST.</p>"}],
                    S5: []

                victor: {
                    title: "Victor",
                    S2: [
                        {"t": "pericia - allan", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O Juízo observa que o reclamante postula o reconhecimento de doença ocupacional, com requerimento de realização de perícia. A fim de imprimir celeridade e efetividade ao feito, proceder-se-á à produção integral da prova oral nesta audiência, inclusive quanto ao objeto da perícia a ser realizada, com a designação de perícia após o encerramento da produção de prova oral.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Tendo em vista o pedido de adicional de PERICULOSIDADE, determina-se a realização da perícia técnica. Fica nomeado o Sr. Perito Eng. ALLAN STRUCK PINHEIRO - Cel: (11) 94264-5345 - e-mail: peritoallan.pinheiro@gmail.com, devendo apresentar seu laudo no prazo de 30 dias, acompanhado da proposta de honorários, ficando advertido de que eventuais atrasos serão levados em consideração na fixação do valor. Intime-se.&nbsp;</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">No mesmo prazo da réplica acima deferido, as partes poderão apresentar quesitos e indicar assistentes técnicos, sendo que nesta oportunidade o(a) reclamante poderá descrever suas atividades, local e o setor de trabalho, sob pena de preclusão e de serem consideradas as atividades e informações descritas no laudo pericial.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Atente-se o Expert para esta determinação. Fica autorizado o acompanhamento da diligência pelo(a) reclamante e assistentes técnicos das partes, devendo entrar em contato diretamente com o Sr. Perito, sob pena de preclusão.&nbsp;</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">As partes serão intimadas da data da perícia, a qual se realizará no seguinte endereço: *&nbsp;</p>"},
                        {"t": "pericia - regiane", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O Juízo observa que o reclamante postula o reconhecimento de doença ocupacional, com requerimento de realização de perícia. A fim de imprimir celeridade e efetividade ao feito, proceder-se-á à produção integral da prova oral nesta audiência, inclusive quanto ao objeto da perícia a ser realizada, com a designação de perícia após o encerramento da produção de prova oral.</p><p style=\"text-align:justify;text-indent:3cm;\">Tendo &nbsp;em &nbsp;vista &nbsp;o &nbsp;pedido &nbsp;de &nbsp;adicional &nbsp;de INSALUBRIDADE, &nbsp;determina-se &nbsp;a &nbsp;realização &nbsp;da perícia técnica. Fica nomeado o Sra. Perita &nbsp;REGIANE SOUZA ROCHA SILVA - e-mail: peritaregianesilva@gmail.com, &nbsp;devendo &nbsp;apresentar &nbsp;seu &nbsp;laudo &nbsp;no &nbsp;prazo &nbsp;de &nbsp;30 &nbsp;dias, &nbsp;acompanhado &nbsp;da proposta &nbsp;de &nbsp;honorários, &nbsp;ficando &nbsp;advertido &nbsp;de &nbsp;que &nbsp;eventuais &nbsp;atrasos &nbsp;serão &nbsp;levados &nbsp;em &nbsp;consideração &nbsp;na fixação do valor. Intime-se.</p><p style=\"text-align:justify;text-indent:3cm;\">No &nbsp;mesmo &nbsp;prazo &nbsp;da &nbsp;réplica &nbsp;acima &nbsp;deferido, &nbsp;as &nbsp;partes &nbsp;poderão &nbsp;apresentar &nbsp;quesitos &nbsp;e &nbsp;indicar assistentes &nbsp;técnicos, &nbsp;sendo &nbsp;que &nbsp;nesta &nbsp;oportunidade &nbsp;o(a) &nbsp;reclamante &nbsp;poderá &nbsp;descrever &nbsp;suas &nbsp;atividades, local &nbsp;e &nbsp;o &nbsp;setor &nbsp;de &nbsp;trabalho, &nbsp;sob &nbsp;pena &nbsp;de &nbsp;preclusão &nbsp;e &nbsp;de &nbsp;serem &nbsp;consideradas &nbsp;as &nbsp;atividades &nbsp;e &nbsp;informações descritas no laudo pericial. Atente-se o Expert para esta determinação. Fica &nbsp;autorizado &nbsp;o &nbsp;acompanhamento &nbsp;da &nbsp;diligência &nbsp;pelo(a) &nbsp;reclamante &nbsp;e &nbsp;assistentes técnicos &nbsp;das &nbsp;partes, &nbsp;devendo &nbsp;entrar &nbsp;em &nbsp;contato &nbsp;diretamente &nbsp;com &nbsp;o &nbsp;Sr. &nbsp;Perito, &nbsp;sob &nbsp;pena &nbsp;de preclusão.As &nbsp;partes &nbsp;serão &nbsp;intimadas &nbsp;da &nbsp;data &nbsp;da &nbsp;perícia, &nbsp;a &nbsp;qual &nbsp;se &nbsp;realizará &nbsp;no &nbsp;endereço: Rua&nbsp;</p>"},
                        {"t": "Pericia - cirino", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O Juízo observa que o reclamante postula o reconhecimento de doença ocupacional, com requerimento de realização de perícia. A fim de imprimir celeridade e efetividade ao feito, proceder-se-á à produção integral da prova oral nesta audiência, inclusive quanto ao objeto da perícia a ser realizada, com a designação de perícia após o encerramento da produção de prova oral.</p><p style=\"text-align:justify;text-indent:3cm;\">Tendo em vista o pedido de PERÍCIA MÉDICA, determina-se a realização da perícia técnica. Fica nomeado o Sr. Perito Médico ALEXANDRE CIRINO, que deverá apresentar seu laudo no prazo de 20 dias após a realização da perícia médica, que ocorrerá na data de 06/10/26 às 14h30min na 3ª Vara do Trabalho do Fórum da Zona Sul: Av. Guido Caloi, 1000, 2º andar, São Paulo/SP - Cel (11) 97160-1309 - e-mail: alecirino@terra.com.br, acompanhado da proposta de honorários, ficando advertido de que eventuais atrasos serão levados em consideração na fixação do valor.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">O reclamante deverá portar todas as suas CTPS no dia da perícia. Intime-se.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">No mesmo prazo da réplica acima deferido, as partes poderão apresentar quesitos e indicar assistentes técnicos, sendo que nesta oportunidade o(a) reclamante poderá descrever suas atividades, local e o setor de trabalho, sob pena de preclusão e de serem consideradas as atividades e informações descritas no laudo pericial.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">Atente-se o Expert para esta determinação.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">Fica autorizado o acompanhamento da diligência pelo(a) reclamante assistentes técnicos das partes. As partes já estão cientes da data da perícia médica.</p><p style=\"text-align:justify;text-indent:3cm;\">A ausência da parte reclamante acarretará a preclusão da prova pericial e aplicação de multa por litigância de má fé, se não comprovadamente justificada NOS AUTOS em até 48 horas após a data do exame, independentemente de intimação específica para tanto.</p>"},
                        {"t": "Pericia Vladia", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O Juízo observa que o reclamante postula o reconhecimento de doença ocupacional, com requerimento de realização de perícia. A fim de imprimir celeridade e efetividade ao feito, proceder-se-á à produção integral da prova oral nesta audiência, inclusive quanto ao objeto da perícia a ser realizada, com a designação de perícia após o encerramento da produção de prova oral.</p><p style=\"text-align:justify;text-indent:3cm;\">Tendo em vista o pedido de PERÍCIA MÉDICA, determina-se a realização da perícia técnica.<br>Fica nomeado o Sr. Perito Médico VLADIA JUOZEPAVICIUS GONÇALVES (email vladia2112@yahoo.com.br e telefone: 11 4992-9209), que deverá apresentar seu laudo no prazo de 30 dias após a realização da perícia médica, que ocorrerá em data e local a serem informados pela expert &nbsp;acompanhado da proposta de honorários, ficando advertido de que eventuais atrasos serão levados em consideration na fixação do valor.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">O reclamante deverá portar todas as suas CTPS no dia da perícia. Intime-se.</p><p style=\"text-align:justify;text-indent:3cm;\">No prazo de 05 dias, as partes poderão apresentar quesitos e indicar assistentes técnicos, sendo que nesta oportunidade o(a) reclamante poderá descrever suas atividades, local e o setor de trabalho, sob pena de preclusão e de serem consideradas as atividades e informações descritas no laudo pericial.</p><p style=\"text-align:justify;text-indent:3cm;\">Atente-se o Expert para esta determinação.</p><p style=\"text-align:justify;text-indent:3cm;\">Fica autorizado o acompanhamento da diligência pelo(a) reclamante assistentes técnicos das partes.</p>"},
                        {"t": "pericia (sem instrução)", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O Juízo observa que o reclamante postula o reconhecimento de doença ocupacional / adicional de insalubridade / periculosidade, com requerimento de realização de perícia.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">As partes dispensam os depoimentos pessoais reciprocamente.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">As partes não têm testemunhas.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Fica preclusa a produção de prova oral.</p><p style=\"text-align:justify;text-indent:3cm;\">Determina-se a realização da perícia técnica. Fica nomeado o Sr. Perito, devendo apresentar seu laudo no prazo de 30 dias, acompanhado da proposta de honorários. Intime-se.&nbsp;</p>"},
                        {"t": "Prova emprestada", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Nos termos da Tese 140, recentemente editada pelo C. TST, “a utilização de prova pericial emprestada para comprovar insalubridade ou periculosidade é válida, independentemente da concordância da parte contrária, desde que esteja presente a identidade fática entre o processo de origem e o processo em que a prova é utilizada, e seja observado o contraditório na produção da prova original e nos autos em que é trasladada, não configurando nulidade processual o indeferimento de nova perícia quando observados esses requisitos.”</p><p style=\"text-align:justify;text-indent:3cm;\">No particular, a primeira reclamada informa que a obra na qual o reclamante se ativou já foi encerrada, inviabilizando a realização de perícia no local.</p><p style=\"text-align:justify;text-indent:3cm;\">Por conta disso, determino a utilização de prova emprestada nos autos, consistente na juntada de laudo pericial pelas partes no prazo de 05 dias.</p><p style=\"text-align:justify;text-indent:3cm;\">O contraditório será exercido de forma plena na apresentação de razões finais, bem como na possibilidade de produção de prova oral nesta audiência.</p>"}
                    ],
                    S1: [{"t": "Sem dep pessoal", "h": "<p style=\"text-align:justify;text-indent:3cm;\">As partes pleiteiam a oitiva do depoimento pessoal da parte adversa, a despeito de ter trazido consigo testemunhas para serem ouvidas.</p><p style=\"text-align:justify;text-indent:3cm;\">Considerando o disposto no artigo 848 da CLT, a oitiva das partes constitui faculdade do magistrado, e não direito subjetivo das partes, razão pela qual é inaplicável, ao processo do trabalho, a regra prevista no artigo 385 do CPC de 2015, diante da existência de disciplina específica na legislação consolidada.</p><p style=\"text-align:justify;text-indent:3cm;\">Outrossim, o artigo 765 da CLT confere ao juiz amplos poderes na direção do processo, autorizando-o a indeferir provas que reputar desnecessárias à formação do seu convencimento. No caso, este magistrado entende prescindível a colheita dos depoimentos pessoais, notadamente porque as partes conduziram ao átrio da sala de audiências pessoas para serem ouvidas na condição de testemunhas. Isto é, a prova a ser produzida é apta a esclarecer, com qualidade, os fatos trazidos à discussão.</p><p style=\"text-align:justify;text-indent:3cm;\">A jurisprudência da Subseção I Especializada em Dissídios Individuais do Tribunal Superior do Trabalho, cf. TST - E-RRAg: 00017111520175060014, Relator.: Breno Medeiros, Data de Julgamento: 16/05/2024, Subseção I Especializada em Dissídios Individuais, Data de Publicação: 08/11/2024, consolidou entendimento no sentido de que o interrogatório das partes é prerrogativa do magistrado, à luz dos artigos 848 e 765 da CLT, sendo igualmente afastada a aplicação subsidiária do artigo 385 do CPC, ante a inexistência de lacuna normativa.</p><p style=\"text-align:justify;text-indent:3cm;\">No julgamento levado a efeito pela Subseção I Especializada em Dissídios Individuais do Tribunal Superior do Trabalho, a ratio decidendi foi construída a partir do contexto fático em que a parte reclamada alegava cerceamento do direito de defesa em razão do indeferimento, pelo juízo de origem, tanto do pedido de adiamento da audiência para a oitiva de testemunha quanto da colheita dos depoimentos pessoais, sendo certo que, naquela assentada, nenhuma das partes dispunha de testemunhas a serem ouvidas.</p><p style=\"text-align:justify;text-indent:3cm;\">Constatou-se que o adiamento fora indeferido por ausência de comprovação tempestiva do convite à testemunha, nos termos do artigo 455, § 1º, do CPC de 2015, e que, quanto aos depoimentos pessoais, o Tribunal Regional do Trabalho da 6ª Região reconhecera tratar-se de ato inserido no poder discricionário do magistrado, à luz do artigo 848 da CLT.</p><p style=\"text-align:justify;text-indent:3cm;\">A SDI-I, ao manter tal compreensão, firmou o entendimento de que a inexistência de prova oral a produzir, por si só, não impõe a realização do interrogatório das partes, porquanto a oitiva pessoal não constitui direito das partes, mas faculdade do juiz.</p><p style=\"text-align:justify;text-indent:3cm;\">A fortiori, em casos como o em comento, em que há testemunhas a serem ouvidas, também se mostra dispensável a oitiva das partes.</p><p style=\"text-align:justify;text-indent:3cm;\">Dessa forma, a decisão acerca da realização, ou não, dos depoimentos pessoais insere-se no âmbito do poder de condução do processo atribuído ao magistrado, não se tratando de prerrogativa das partes.</p><p style=\"text-align:justify;text-indent:3cm;\">Indefiro, portanto, o pleito de oitiva das partes.</p><p style=\"text-align:justify;text-indent:3cm;\">Protestos das partes.</p>"}, {"t": "Instrução", "h": "<p style=\"text-align:justify;text-indent:3cm;\">INCONCILIADOS.<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">A(s) defesa(s) está(ão) nos autos.</p><p style=\"text-align:justify;text-indent:3cm;\">O Ato Normativo 003626-80.2025.2.00.0000 do CNJ, de setembro de 2025, estipula a obrigatoriedade do registro audiovisual de todas as audiências (arts. 1º e 3º). Nesse sentido, esclareço que a audiência será gravada, com disponibilização de link no acervo eletrônico dos autos, exceto na fase de tratativas de conciliação, ao início e ao final da audiência (CLT, arts. 846 e 850), haja vista a confidencialidade garantida pelo art. 30 da Lei 13.140/15, como aliás já decidiu o TED da OAB/SP (Processo: E-6.115/2023).</p><p style=\"text-align:justify;text-indent:3cm;\">Portanto, os depoimentos prestados na presente audiência serão integralmente gravados, razão pela qual não haverá pelo(a) magistrado (a), a transcrição exata das declarações dos depoentes.</p><p style=\"text-align:justify;text-indent:3cm;\">Todavia, visando apenas a facilitação de suas manifestações sobre o conteúdo da prova, será elaborado por ferramenta de Inteligência Artificial (Google) um breve resumo das informações úteis ao julgamento da causa (art. 851 e 852-F da CLT), ficando expressamente destacado que esse breve resumo não substitui, para fins probatórios, a íntegra dos depoimentos - que estarão documentados em meio audiovisual - e nem implica aquiescência das partes quanto ao conteúdo do resumo, servindo apenas e tão somente para auxílio na análise das provas. Portanto, prevalece em caso de divergências a versão original do vídeo disponibilizada no sistema PJe.</p><p style=\"text-align:justify;text-indent:3cm;\">Havendo interesse de se valer, em razões finais ou para fins recursais, de trechos específicos dos depoimentos, deverão as partes indicar com precisão o nome do arquivo, o minuto e o segundo em que o trecho degravado está registrado. A parte adversa, caso discorde da degravação, deverá apresentar impugnação especificada.</p><p style=\"text-align:justify;text-indent:3cm;\">Oportuno destacar que a gravação da audiência pelas partes e por seus advogados é lícita, independentemente da gravação feita pelo juízo (CPC, art. 367, §§ 5º e 6º), mas deve ser precedida de comunicação e identificação prévia dos envolvidos (Art. 5º, § 1º ato normativo), sendo limitada ao uso processual, sendo EXPRESSAMENTE VEDADA a sua utilização para outras finalidades, notadamente publicações em redes sociais, monetização, transmissões on-line, páginas de internet ou compartilhamentos por meio de aplicativos de mensagens (art. 5º, § 4º, II, B, do referido ato).</p><p style=\"text-align:justify;text-indent:3cm;\">Assim, e considerando ainda que a imagem e a voz humanas são protegidas legal e constitucionalmente contra reproduções não autorizadas pelo titular do direito de personalidade respectivo, ficam as partes advertidas de que o Juízo não autoriza o uso ou a reprodução da imagem e ou da voz de qualquer um dos sujeitos processuais por qualquer meio externo ao processo, físico ou eletrônico, sob pena de responsabilidade civil e criminal dos envolvidos.</p><p style=\"text-align:justify;text-indent:3cm;\">Neste momento, inicia-se a gravação da audiência.<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">Depoimento pessoal do(a) reclamante: Gravado em áudio e vídeo.<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">Depoimento pessoal do(a) preposto(a) da 1ª reclamada: Gravado em áudio e vídeo.</p><p style=\"text-align:justify;text-indent:3cm;\">1ª testemunha do(a) <u>reclamante</u>: *, CPF nº *, residente no endereço *.&nbsp;<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">1ª testemunha do(a) <u>reclamado(a)</u>: *, CPF nº *, residente no endereço *.<br>&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">As partes não têm outras provas a produzir.</p><p style=\"text-align:justify;text-indent:3cm;\">Encerrada a instrução processual.</p><p style=\"text-align:justify;text-indent:3cm;\">Frustrada a última tentativa conciliatória.</p><p style=\"text-align:justify;text-indent:3cm;\">Razões finais facultadas no prazo comum de 02 dias, devendo o(a) reclamante manifestar-se acerca da defesa e documentos no mesmo prazo.</p><p style=\"text-align:justify;text-indent:3cm;\">Designa-se para julgamento a data de 16/09/2026 às 16:__ horas, sendo que as partes serão intimadas da sentença via Diário Oficial.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às %HEC%.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "Victor - Instrução com peritos", "h": "<p style=\"text-align:justify;text-indent:3cm;\"><strong>Prejudicada a conciliação.&nbsp;</strong></p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Recebida a(s) defesa(a) e documentos juntados via sistema.&nbsp;</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Prazo de 5 dias para réplica, sob pena de preclusão.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O Juízo observa que o reclamante postula o pagamento de adicional de <strong>***periculosidade e ***insalubridade, c</strong>om requerimento de realização de perícia. A fim de imprimir celeridade e efetividade ao feito, proceder-se-á à produção integral da prova oral nesta audiência, inclusive quanto ao objeto da perícia a ser realizada, com a designação de perícia após o encerramento da produção de prova oral.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A Recomendação CNJ n. 94 de 2021 recomenda aos tribunais brasileiros a gravação de atos processuais, sejam presenciais ou virtuais e a gravação dos depoimentos encontra-se autorizada pelas Resoluções 105/2010 do CNJ, 185/2017 do CSJT e 313/2021 do CSJT. Portanto, os depoimentos prestados na presente audiência serão integralmente gravados, razão pela qual não haverá pelo(a) magistrado (a), a transcrição exata das declarações dos depoentes.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Todavia, visando apenas a facilitação de suas manifestações sobre o conteúdo da prova, será elaborado por ferramenta de Inteligência Artificial (Google) um breve resumo das informações úteis ao julgamento da causa (art. 851 e 852-F da CLT), ficando expressamente destacado que esse breve resumo não substitui, para fins probatórios, a íntegra dos depoimentos - que estarão documentados em meio audiovisual - e nem implica aquiescência das partes quanto ao conteúdo do resumo, servindo apenas e tão somente para auxílio na análise das provas. Portanto, prevalece em caso de divergências a versão original do vídeo disponibilizada no sistema PJe.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Havendo interesse de se valer, em razões finais ou para fins recursais, de trechos específicos dos depoimentos, deverão as partes indicar com precisão o nome do arquivo, o minuto e o segundo em que o trecho degravado está registrado. A parte adversa, caso discorde da degravação, deverá apresentar impugnação especificada.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A gravação audiovisual de audiências, a despeito de se tratar de faculdade conferida às partes pelo artigo 367, § 6.º, do CPC, destina-se exclusivamente a finalidades endoprocessuais, nos autos da reclamatória trabalhista em que realizada. Assim, e considerando ainda que a imagem e a voz humanas são protegidas legal e constitucionalmente contra reproduções não autorizadas pelo titular do direito de personalidade respectivo, ficam as partes advertidas de que o Juízo não autoriza o uso ou a reprodução da imagem e/ou da voz de qualquer um dos sujeitos processuais por qualquer meio externo ao processo, físico ou eletrônico, sob pena de responsabilidade civil e criminal dos envolvidos.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\"><strong><u>Neste momento, inicia-se a gravação da audiência.</u></strong></p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Depoimento pessoal do(a) reclamante: Gravado em áudio e vídeo.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Depoimento pessoal do(a) preposto(a) da * reclamada: Gravado em áudio e vídeo.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">1ª testemunha do(a) <u>reclamante</u>: *, CPF nº *, residente no endereço *.&nbsp;</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\"><strong>Gravado em áudio e vídeo.</strong></p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">1ª testemunha do(a)&nbsp;<u>reclamando(a)</u>: *, CPF nº *, residente no endereço *.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\"><strong>Gravado em áudio e vídeo.</strong></p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Fica preclusa a produção de prova oral.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Em&nbsp;observância&nbsp;ao&nbsp;disposto&nbsp;no&nbsp; art.&nbsp; 34&nbsp;da&nbsp;Consolidação&nbsp;das Normas da Corregedoria desse Regional, designa-se audiência de <strong>Encerramento da Instrução para o dia 16/09/2026 às 16:__ horas</strong>, dispensado o comparecimento das partes e procuradores.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Audiência encerrada às 15:22.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "Encerramento s/ oitiva", "h": "<p style=\"text-align:justify;text-indent:3cm;\">As partes dispensam os depoimentos pessoais reciprocamente.</p><p style=\"text-align:justify;text-indent:3cm;\">As partes não têm testemunhas.</p><p style=\"text-align:justify;text-indent:3cm;\">Fica preclusa a produção de prova oral.</p><p style=\"text-align:justify;text-indent:3cm;\">Designa-se audiência de JULGAMENTO para o dia 16/09/2026 às 16:__ horas, dispensado o comparecimento das partes e procuradores.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às %HEC%.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "revelia", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Diante da ausência injustificada da reclamada, aplico-lhe a pena de revelia e confissão.</p>"}, {"t": "Dispensa Testemunha", "h": "<p style=\"text-align:justify;text-indent:3cm;\">O reclamante requer a oitiva da testemunha **** , com o intuito de comprovar a existência de vínculo de emprego.</p><p style=\"text-align:justify;text-indent:3cm;\">No particular, considero desnecessária a oitiva da testemunha, porquanto os depoimentos pessoais das partes são convergentes entre si, praticamente uníssonos, dirimindo a controvérsia sobre as questões de fato que abarcam o presente processo. Por conta disso, indefiro o depoimento. Protestos.</p>"}],
                    S3: [{"t": "provimento", "h": "<p style=\"text-align:justify;text-indent:3cm;\">O(a) advogado(a) do(a) * requer o adiamento da presente audiência, tendo em vista que a(s) testemunha(s) *, embora convidada(s), não compareceu(ram).&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">O advogado requer que a intimação seja feita na forma do Provimento.</p><p style=\"text-align:justify;text-indent:3cm;\">Deferido.</p><p style=\"text-align:justify;text-indent:3cm;\"><u>Designa-se nova audiência UNA para o dia /11/26, às * horas, mantendo-se as cominações anteriores.&nbsp;</u></p><p style=\"text-align:justify;text-indent:3cm;\">Servirá o presente como MANDADO DE INTIMAÇÃO DE TESTEMUNHA, comprometendo-se o(a) * a entregar à testemunha acima indicada.&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">A ausência ensejará multa e condução coercitiva. Local: Av. Guido Caloi, 1000, Santo Amaro, São Paulo/SP, CEP 05802-140.</p><p style=\"text-align:justify;text-indent:3cm;\">Saem cientes &nbsp;da nova designação as seguintes testemunhas:</p><p style=\"text-align:justify;text-indent:3cm;\">-Do reclamante -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">-Da reclamada -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">As demais testemunhas virão independentemente de notificação, sob pena de preclusão.</p><p style=\"text-align:justify;text-indent:3cm;\">Lida e conferida a ata pelos presentes é dispensada a assinatura das partes e dos respectivos patronos.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às .</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "Testemunha - independente", "h": "<p style=\"text-align:justify;text-indent:3cm;\">&nbsp;INCONCILIADOS.</p><p style=\"text-align:justify;text-indent:3cm;\">O(a) advogado(a) do(a) * requer o adiamento da presente audiência, tendo em vista que a(s) testemunha(s) *, embora convidada(s), não compareceu(ram), comprometendo-se a trazê-la(s) na próxima sessão independentemente de intimação, sob pena de preclusão.</p><p style=\"text-align:justify;text-indent:3cm;\">Defiro.</p><p style=\"text-align:justify;text-indent:3cm;\"><u>Designa-se nova audiência UNA para o dia /11/26, às * horas, mantendo-se as cominações anteriores.&nbsp;</u></p><p style=\"text-align:justify;text-indent:3cm;\">Saem cientes da nova designação as seguintes testemunhas:</p><p style=\"text-align:justify;text-indent:3cm;\">-Do reclamante -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">-Da reclamada -&nbsp;</p><p style=\"text-align:justify;text-indent:3cm;\">As demais testemunhas virão independentemente de notificação, sob pena de preclusão.</p><p style=\"text-align:justify;text-indent:3cm;\">Lida e conferida a ata pelos presentes é dispensada a assinatura das partes e dos respectivos patronos.</p><p style=\"text-align:justify;text-indent:3cm;\">Registra-se que magistrado, partes e advogados estão no fórum, presencialmente.</p><p style=\"text-align:justify;text-indent:3cm;\">Audiência encerrada às %HEC%.</p><p style=\"text-align:justify;text-indent:3cm;\">Nada mais.</p>"}, {"t": "Citar por mandado e Edital", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Considerando que não há comprovante de recebimento da notificação por parte da&nbsp;<strong>***reclamada</strong>, (aviso de recebimento), determino a renovação da citação da ré por&nbsp;<strong>Oficial de Justiça</strong>, a fim de evitar futura alegação de cerceio de defesa, fato que vem ocorrendo com certa frequência nessas situações.</p><p style=\"text-align:justify;text-indent:3cm;\">Vale dizer, as notificações postais não são entregues pessoalmente a prepostos das reclamadas ou pessoalmente aos reclamantes, mas sim deixadas em \"caixas de correio\" como uma correspondência comum, o que certamente não se pode aceitar em relação a intimações judiciais.</p><p style=\"text-align:justify;text-indent:3cm;\">Cite-se a reclamada por&nbsp;<strong>edital, concomitantemente.</strong></p>"}],
                    S4: [{"t": "Alvará", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A presente ata tem força de ALVARÁ perante a CEF para liberação do FGTS, assim como suprimindo a inexistência do Termo de Rescisão do Contrato de Trabalho/CD, dos recolhimentos rescisórios do FGTS e do carimbo de baixa da CTPS, fornecendo-se, inclusive, os seguintes elementos relativos ao contrato de trabalho: PIS nº: *, data de admissão: * e demissão: *, CNPJ: *. CTPS * Série *-SP tipo de rescisão do contrato de trabalho::<u>****</u></p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A presente ata possui força de ALVARÁ perante a CEF, SINE e demais órgãos competentes para requerimento do seguro-desemprego, suprindo, inclusive, a inexistência do TRCT, das guias SD/CD e do carimbo de baixa da CTPS, caso os prazos de carência e eventuais solicitações anteriores forem atendidas. PIS nº: * , data de admissão: * e demissão: *, CNPJ: * CTPS * Série *-SP&nbsp; tipo de rescisão do contrato de trabalho:<u>****</u></p>"}, {"t": "Acordo - Suspensão +Retorno ao estado anterior", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">As partes, neste ato, ajustam a suspensão do processo <strong>até o dia ******</strong>, data do pagamento da última parcela do acordo.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">O(a) reclamante terá o prazo de 15 dias, contado do termo final da suspensão, para noticiar eventual inadimplemento por parte da reclamada, ficando ciente desde já que no seu silêncio considerar-se-ão adimplidas todas as parcelas.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Nessa hipótese, os autos virão conclusos para homologação do acordo e exclusão das demais reclamadas.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Em caso de descumprimento do acordo, o processo retornará ao estado em que se encontrava, isto é, será designada nova audiência ***<strong>UNA / UNA/RS</strong> para recebimento das defesas e instrução do processo, de sorte que eventual valor parcial do acordo quitado será deduzido de futura execução.</p><p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">Com o pagamento integral do acordo, o(a) reclamante dará geral e plena quitação pelo objeto da inicial e extinto contrato de trabalho.</p>"}, {"t": "acordo subsidiária", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Fica ajustada, ainda, a responsabilidade subsidiária da segunda reclamada, pelo valor integral do acordo na hipótese de inadimplemento por parte da primeira reclamada. Desta feita, caso descumprido o acordo pela primeira reclamada, a segunda reclamada deverá ser intimada para proceder ao pagamento do quanto inadimplido no prazo de 15 dias, observado o valor das parcelas e a sua periodicidade, sendo certo que na hipótese de pagamento tempestivo pela responsável subsidiária não lhe será cobrada multa acima estipulada, sendo que nesse caso a multa será devida exclusivamente pela primeira reclamada</p>"}, {"t": "INSS s/ vínculo", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Após a quitação do acordo, a reclamada deverá comprovar, em 30 dias, o recolhimento das contribuições previdenciárias relacionadas ao item b da discriminação, na forma do Tema 310 do TST.</p>"}],
                    S5: [{"t": "Município revel", "h": "<p style=\"margin-left:0cm;text-align:justify;text-indent:3cm;\">A fazenda pública não está dispensada do comparecimento à audiência, razão pela qual a sua ausência acarreta a revelia e consequente confissão (OJ 152 da SDI-I do C. TST), sendo certo que seu preposto poderia ser ouvido em audiência.</p>"}, {"t": "Tele - Atraso da reclamada", "h": "<p style=\"text-align:justify;text-indent:3cm;\">Neste ato, o Juízo aguardou o ingresso da reclamada por 10 minutos e, além disso, o próprio magistrado procedeu ao ingresso nessa sala utilizando as informações constantes no despacho de fls 115, razão pela qual, não há falar sobre qualquer hipótese de irregularidade por inconsistência técnica no acesso à audiência telepresencial.</p>"}]
                }
            };

const SECOES = {
  S1: "S1 — Instrução / Encerramento",
  S2: "S2 — Perícia",
  S3: "S3 — Adiamento",
  S4: "S4 — Acordo / Alvará",
  S5: "S5 — Outros"
};

// ─────────────────────────────────────────────
// Estado
// ─────────────────────────────────────────────
let perfilAtivo = Object.keys(PERFIS)[0];
let hecIniciado = null;

// ─────────────────────────────────────────────
// HEC — Hora de Encerramento
// ─────────────────────────────────────────────
function hecAtual() {
  const now = new Date();
  return now.toTimeString().slice(0, 5);
}

function atualizarHec() {
  document.getElementById('hec-time').textContent = hecAtual();
}

setInterval(atualizarHec, 10000);
atualizarHec();

document.getElementById('hec-time').addEventListener('click', () => {
  navigator.clipboard.writeText(hecAtual()).catch(() => {});
  showToast('HEC ' + hecAtual() + ' copiado', 'ok');
});

// ─────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}

// ─────────────────────────────────────────────
// Injeção via servidor local
// ─────────────────────────────────────────────
async function injetarNoChrome(html) {
  // Substitui %HEC% pelo horário atual
  html = html.replace(/%HEC%/g, hecAtual());

  const r = await fetch('/inject', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({html})
  });
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || 'Falha ao injetar');
  return data.editor;
}

// ─────────────────────────────────────────────
// Botão de template
// ─────────────────────────────────────────────
function criarBotao(item) {
  const btn = document.createElement('button');
  btn.className = 'btn-tpl';
  btn.textContent = item.t;

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = '...';
    try {
      const editor = await injetarNoChrome(item.h);
      btn.classList.add('success');
      btn.textContent = '✓ Inserido';
      showToast(`✓ Inserido via ${editor}`, 'ok');
    } catch (e) {
      btn.classList.add('error');
      btn.textContent = '✗ Erro';
      showToast('✗ ' + e.message, 'err');
    } finally {
      btn.disabled = false;
      setTimeout(() => {
        btn.classList.remove('success', 'error');
        btn.textContent = orig;
      }, 2000);
    }
  });
  return btn;
}

// ─────────────────────────────────────────────
// Renderização
// ─────────────────────────────────────────────
function renderPerfil() {
  const main   = document.getElementById('main-content');
  const perfil = PERFIS[perfilAtivo];
  main.innerHTML = '';

  const secOrdems = ['S1','S2','S3','S4','S5'];

  for (const sid of secOrdems) {
    const items = perfil[sid];
    if (!items || !items.length) continue;

    const sec = document.createElement('div');
    sec.className = 'secao';

    const hdr = document.createElement('div');
    hdr.className = 'secao-header';
    hdr.innerHTML = `
      <span class="secao-title">${SECOES[sid]}</span>
      <span class="secao-badge">${items.length}</span>
      <span class="secao-chevron">▾</span>
    `;
    hdr.addEventListener('click', () => sec.classList.toggle('collapsed'));

    const body = document.createElement('div');
    body.className = 'secao-body';
    items.forEach(item => body.appendChild(criarBotao(item)));

    sec.appendChild(hdr);
    sec.appendChild(body);
    main.appendChild(sec);
  }

  // Seção consultas
  renderConsultas(main);
}

function renderConsultas(main) {
  const sec = document.createElement('div');
  sec.className = 'secao';

  const hdr = document.createElement('div');
  hdr.className = 'secao-header';
  hdr.innerHTML = `
    <span class="secao-title">Consultas</span>
    <span class="secao-chevron">▾</span>
  `;
  hdr.addEventListener('click', () => sec.classList.toggle('collapsed'));

  const body = document.createElement('div');
  body.className = 'secao-body';
  body.style.flexDirection = 'column';

  // CEP
  const cepRow = document.createElement('div');
  cepRow.className = 'consulta-row';
  const cepLabel = document.createElement('span');
  cepLabel.className = 'consulta-label';
  cepLabel.textContent = 'CEP';
  const cepInput = document.createElement('input');
  cepInput.className = 'consulta-input';
  cepInput.type = 'text';
  cepInput.placeholder = 'Digite o CEP';
  cepInput.inputMode = 'numeric';
  const cepBtn = document.createElement('button');
  cepBtn.className = 'consulta-btn';
  cepBtn.style.background = '#1e88e5';
  cepBtn.textContent = 'Buscar';

  cepBtn.addEventListener('click', async () => {
    const cep = cepInput.value.replace(/\D/g, '');
    if (cep.length !== 8) { showToast('CEP inválido (8 dígitos)', 'err'); return; }
    cepBtn.disabled = true; cepBtn.textContent = '...';
    try {
      const r = await fetch('/cep/' + cep);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      const fmt = cep.substring(0,5) + '-' + cep.substring(5);
      const txt = [d.logradouro + ', número __', d.bairro, 'CEP - ' + fmt, d.localidade + '/' + d.uf].filter(Boolean).join(' - ');
      await navigator.clipboard.writeText(txt);
      showToast('✓ Endereço copiado!', 'ok');
      cepBtn.textContent = 'COPIADO';
      cepBtn.style.background = '#22c55e';
    } catch(e) {
      showToast('✗ ' + e.message, 'err');
      cepBtn.style.background = '#ef4444';
      cepBtn.textContent = 'FALHA';
    } finally {
      cepBtn.disabled = false;
      setTimeout(() => { cepBtn.textContent = 'Buscar'; cepBtn.style.background = '#1e88e5'; }, 3000);
    }
  });

  cepRow.appendChild(cepLabel);
  cepRow.appendChild(cepInput);
  cepRow.appendChild(cepBtn);
  body.appendChild(cepRow);

  sec.appendChild(hdr);
  sec.appendChild(body);
  main.appendChild(sec);
}

// ─────────────────────────────────────────────
// Tabs de perfil
// ─────────────────────────────────────────────
function renderPerfisBar() {
  const bar = document.getElementById('perfis-bar');
  bar.innerHTML = '';
  for (const [key, perfil] of Object.entries(PERFIS)) {
    const tab = document.createElement('button');
    tab.className = 'perfil-tab' + (key === perfilAtivo ? ' active' : '');
    tab.textContent = perfil.title;
    tab.addEventListener('click', () => {
      perfilAtivo = key;
      renderPerfisBar();
      renderPerfil();
    });
    bar.appendChild(tab);
  }
}

// ─────────────────────────────────────────────
// Status do Chrome
// ─────────────────────────────────────────────
async function checkStatus() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await fetch('/status');
    const d = await r.json();
    dot.className = d.ok ? 'ok' : 'err';
    dot.title = d.ok
      ? `Chrome conectado — ${d.pages?.length || 0} aba(s)`
      : `Desconectado: ${d.error}`;
  } catch(e) {
    dot.className = 'err';
    dot.title = 'Servidor offline';
  }
}

setInterval(checkStatus, 5000);
checkStatus();

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
renderPerfisBar();
renderPerfil();
</script>
</body>
</html>
