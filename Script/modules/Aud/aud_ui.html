<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PJeTools — Aud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #1a1c23;
    --surface:  #22252f;
    --surface2: #2a2d3a;
    --border:   #3a3d4d;
    --accent:   #4f8ef7;
    --accent2:  #7c3aed;
    --green:    #22c55e;
    --red:      #ef4444;
    --text:     #e2e8f0;
    --text2:    #94a3b8;
    --radius:   8px;
    --shadow:   0 4px 20px rgba(0,0,0,.4);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: linear-gradient(135deg, #1e2235 0%, #252840 100%);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }

  header .logo {
    font-size: 15px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }

  header .hec-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px 10px;
  }

  header .hec-label { font-size: 11px; color: var(--text2); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }

  #hec-time {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    cursor: pointer;
  }

  #hec-time:hover { color: #fff; }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background .4s;
    flex-shrink: 0;
  }
  #status-dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  #status-dot.err { background: var(--red);   box-shadow: 0 0 6px var(--red); }

  /* ── Perfil tabs ── */
  .perfis-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .perfil-tab {
    padding: 7px 18px;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    border-bottom: none;
  }

  .perfil-tab:hover { color: var(--text); background: var(--surface2); }
  .perfil-tab.active {
    background: var(--bg);
    color: var(--accent);
    border-color: var(--border);
    border-bottom-color: var(--bg);
  }

  /* ── Seções ── */
  main { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }

  .secao { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  .secao-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .secao-header:hover { background: var(--border); }

  .secao-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text2);
  }

  .secao-badge {
    font-size: 10px;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    padding: 1px 7px;
    font-weight: 700;
  }

  .secao-chevron {
    margin-left: auto;
    font-size: 11px;
    color: var(--text2);
    transition: transform .2s;
  }

  .secao.collapsed .secao-chevron { transform: rotate(-90deg); }
  .secao.collapsed .secao-body    { display: none; }

  .secao-body {
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  /* ── Botões de template ── */
  .btn-tpl {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface2);
    color: var(--text);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .18s;
    white-space: nowrap;
  }

  .btn-tpl:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(79,142,247,.35);
  }

  .btn-tpl.success {
    background: var(--green) !important;
    border-color: var(--green) !important;
    color: #fff !important;
  }

  .btn-tpl.error {
    background: var(--red) !important;
    border-color: var(--red) !important;
    color: #fff !important;
  }

  /* ── Consultas ── */
  .consulta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }

  .consulta-label {
    flex: 0 0 70px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
  }

  .consulta-input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: border-color .2s;
  }

  .consulta-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(79,142,247,.2);
  }

  .consulta-btn {
    flex: 0 0 76px;
    padding: 6px 4px;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s, transform .2s;
  }

  .consulta-btn:hover:not(:disabled) { opacity: .85; transform: translateY(-1px); }
  .consulta-btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow);
    transition: transform .3s ease;
    z-index: 9999;
    white-space: nowrap;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.ok   { border-color: var(--green); color: var(--green); }
  #toast.err  { border-color: var(--red);   color: var(--red); }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

  <span class="logo">⚖ PJeTools Aud</span>

<main id="main-content"></main>
<div id="toast"></div>

const PERFIS = {
  otavio: {

    S1: [
      {t:"Instrução", h:`<p style="text-align:justify;text-indent:3cm;">Prazo de 05 dias para regularização processual.</p><p style="text-align:justify;text-indent:3cm;"><u>CONCILIAÇÃO REJEITADA</u></p><p style="text-align:justify;text-indent:3cm;">Defesa com documentos.</p><p style="text-align:justify;text-indent:3cm;">Concede-se o prazo de 05 dias para o reclamante se manifestar sobre a(s) defesa(s) e documento(s), apontando, inclusive, eventuais diferenças que entende devidas, ainda que por amostragem, sob pena de preclusão, observando os termos do artigo 372 do CPC.</p><p style="text-align:justify;text-indent:3cm;">Neste momento, inicia-se a gravação da audiência.<br>&nbsp;</p><p style="text-align:justify;text-indent:3cm;">Depoimento pessoal do(a) reclamante:"Que<br>&nbsp;</p><p style="text-align:justify;text-indent:3cm;">Depoimento pessoal do(a) preposto(a) da &nbsp;1ª reclamada: "Que</p><p style="text-align:justify;text-indent:3cm;">Testemunha do(a) reclamante, CPF, residente e domiciliada, São Paulo/SP.</p><p style="text-align:justify;text-indent:3cm;">Advertida e compromissada.</p><p style="text-align:justify;text-indent:3cm;">Depoimento: "</p><p style="text-align:justify;text-indent:3cm;">As partes não pretendem outras provas.</p><p style="text-align:justify;text-indent:3cm;">Após o prazo de réplica, estará encerrada a instrução processual.</p><p style="text-align:justify;text-indent:3cm;">Razões finais em 05 dias.</p><p style="text-align:justify;text-indent:3cm;">Conciliação final rejeitada.</p><p style="text-align:justify;text-indent:3cm;">Audiência encerrada às %HEC%.</p><p style="text-align:justify;text-indent:3cm;">Nada mais.</p>`},

      {t:"Alvará", h:`<p style="margin-left:0cm;text-align:justify;text-indent:3cm;">A presente ata tem força de ALVARÁ perante a CEF para liberação do FGTS, assim como suprimindo a inexistência do Termo de Rescisão do Contrato de Trabalho/CD, dos recolhimentos rescisórios do FGTS e do carimbo de baixa da CTPS, fornecendo-se, inclusive, os seguintes elementos relativos ao contrato de trabalho: PIS nº: *, data de admissão: * e demissão: *, CNPJ: *. CTPS * Série *-SP tipo de rescisão do contrato de trabalho::<u>****</u></p>`},

    S3: [
      {t:"provimento", h:`<p style="text-align:justify;text-indent:3cm;">O(a) advogado(a) do(a) * requer o adiamento da presente audiência, tendo em vista que a(s) testemunha(s) *, embora convidada(s), não compareceu(ram).&nbsp;</p><p style="text-align:justify;text-indent:3cm;">O advogado requer que a intimação seja feita na forma do Provimento. Deferido.</p><p style="text-align:justify;text-indent:3cm;"><u>Designa-se nova audiência UNA para o dia /11/26, às * horas.</u></p><p style="text-align:justify;text-indent:3cm;">Audiência encerrada às .</p><p style="text-align:justify;text-indent:3cm;">Nada mais.</p>`},
      {t:"Testemunha - independente", h:`<p style="text-align:justify;text-indent:3cm;">&nbsp;INCONCILIADOS.</p><p style="text-align:justify;text-indent:3cm;">O(a) advogado(a) do(a) * requer o adiamento da presente audiência, tendo em vista que a(s) testemunha(s) *, embora convidada(s), não compareceu(ram), comprometendo-se a trazê-la(s) na próxima sessão independentemente de intimação.</p><p style="text-align:justify;text-indent:3cm;"><u>Designa-se nova audiência UNA para o dia /11/26, às * horas.</u></p><p style="text-align:justify;text-indent:3cm;">Audiência encerrada às %HEC%.</p><p style="text-align:justify;text-indent:3cm;">Nada mais.</p>`},
      {t:"Citar por mandado e Edital", h:`<p style="text-align:justify;text-indent:3cm;">Considerando que não há comprovante de recebimento da notificação por parte da&nbsp;<strong>***reclamada</strong>, determino a renovação da citação da ré por&nbsp;<strong>Oficial de Justiça</strong>.</p><p style="text-align:justify;text-indent:3cm;">Cite-se a reclamada por&nbsp;<strong>edital, concomitantemente.</strong></p>`}
    ],
    S4: [
      {t:"Alvará", h:`<p style="margin-left:0cm;text-align:justify;text-indent:3cm;">A presente ata tem força de ALVARÁ perante a CEF para liberação do FGTS. PIS nº: *, data de admissão: * e demissão: *, CNPJ: *. CTPS * Série *-SP tipo de rescisão: <u>****</u></p>`},
      {t:"Acordo - Suspensão", h:`<p style="margin-left:0cm;text-align:justify;text-indent:3cm;">As partes, neste ato, ajustam a suspensão do processo <strong>até o dia ******</strong>, data do pagamento da última parcela do acordo.</p><p style="margin-left:0cm;text-align:justify;text-indent:3cm;">Com o pagamento integral do acordo, o(a) reclamante dará geral e plena quitação pelo objeto da inicial e extinto contrato de trabalho.</p>`},
      {t:"acordo subsidiária", h:`<p style="text-align:justify;text-indent:3cm;">Fica ajustada, ainda, a responsabilidade subsidiária da segunda reclamada, pelo valor integral do acordo na hipótese de inadimplemento por parte da primeira reclamada.</p>`}
    ],
    S5: [
      {t:"Município revel", h:`<p style="margin-left:0cm;text-align:justify;text-indent:3cm;">A fazenda pública não está dispensada do comparecimento à audiência, razão pela qual a sua ausência acarreta a revelia e consequente confissão (OJ 152 da SDI-I do C. TST).</p>`},
      {t:"Tele - Atraso reclamada", h:`<p style="text-align:justify;text-indent:3cm;">Neste ato, o Juízo aguardou o ingresso da reclamada por 10 minutos e, além disso, o próprio magistrado procedeu ao ingresso nessa sala, razão pela qual, não há falar sobre qualquer hipótese de irregularidade.</p>`}
    ]
  }
};

const SECOES = {
  S1: "S1 — Instrução / Encerramento",
  S2: "S2 — Perícia",
  S3: "S3 — Adiamento",
  S4: "S4 — Acordo / Alvará",
  S5: "S5 — Outros"
};

// ─────────────────────────────────────────────
// Estado
// ─────────────────────────────────────────────
let perfilAtivo = Object.keys(PERFIS)[0];
let hecIniciado = null;

// ─────────────────────────────────────────────
// HEC — Hora de Encerramento
// ─────────────────────────────────────────────
function hecAtual() {
  const now = new Date();
  return now.toTimeString().slice(0, 5);
}

function atualizarHec() {
  document.getElementById('hec-time').textContent = hecAtual();
}

setInterval(atualizarHec, 10000);
atualizarHec();

document.getElementById('hec-time').addEventListener('click', () => {
  navigator.clipboard.writeText(hecAtual()).catch(() => {});
  showToast('HEC ' + hecAtual() + ' copiado', 'ok');
});

// ─────────────────────────────────────────────
// Toast
// ─────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}

// ─────────────────────────────────────────────
// Injeção via servidor local
// ─────────────────────────────────────────────
async function injetarNoChrome(html) {
  // Substitui %HEC% pelo horário atual
  html = html.replace(/%HEC%/g, hecAtual());

  const r = await fetch('/inject', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({html})
  });
  const data = await r.json();
  if (!data.ok) throw new Error(data.error || 'Falha ao injetar');
  return data.editor;
}

// ─────────────────────────────────────────────
// Botão de template
// ─────────────────────────────────────────────
function criarBotao(item) {
  const btn = document.createElement('button');
  btn.className = 'btn-tpl';
  btn.textContent = item.t;

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = '...';
    try {
      const editor = await injetarNoChrome(item.h);
      btn.classList.add('success');
      btn.textContent = '✓ Inserido';
      showToast(`✓ Inserido via ${editor}`, 'ok');
    } catch (e) {
      btn.classList.add('error');
      btn.textContent = '✗ Erro';
      showToast('✗ ' + e.message, 'err');
    } finally {
      btn.disabled = false;
      setTimeout(() => {
        btn.classList.remove('success', 'error');
        btn.textContent = orig;
      }, 2000);
    }
  });
  return btn;
}

// ─────────────────────────────────────────────
// Renderização
// ─────────────────────────────────────────────
function renderPerfil() {
  const main   = document.getElementById('main-content');
  const perfil = PERFIS[perfilAtivo];
  main.innerHTML = '';

  const secOrdems = ['S1','S2','S3','S4','S5'];

  for (const sid of secOrdems) {
    const items = perfil[sid];
    if (!items || !items.length) continue;

    const sec = document.createElement('div');
    sec.className = 'secao';

    const hdr = document.createElement('div');
    hdr.className = 'secao-header';
    hdr.innerHTML = `
      <span class="secao-title">${SECOES[sid]}</span>
      <span class="secao-badge">${items.length}</span>
      <span class="secao-chevron">▾</span>
    `;
    hdr.addEventListener('click', () => sec.classList.toggle('collapsed'));

    const body = document.createElement('div');
    body.className = 'secao-body';
    items.forEach(item => body.appendChild(criarBotao(item)));

    sec.appendChild(hdr);
    sec.appendChild(body);
    main.appendChild(sec);
  }

  // Seção consultas
  renderConsultas(main);
}

function renderConsultas(main) {
  const sec = document.createElement('div');
  sec.className = 'secao';

  const hdr = document.createElement('div');
  hdr.className = 'secao-header';
  hdr.innerHTML = `
    <span class="secao-title">Consultas</span>
    <span class="secao-chevron">▾</span>
  `;
  hdr.addEventListener('click', () => sec.classList.toggle('collapsed'));

  const body = document.createElement('div');
  body.className = 'secao-body';
  body.style.flexDirection = 'column';

  // CEP
  const cepRow = document.createElement('div');
  cepRow.className = 'consulta-row';
  const cepLabel = document.createElement('span');
  cepLabel.className = 'consulta-label';
  cepLabel.textContent = 'CEP';
  const cepInput = document.createElement('input');
  cepInput.className = 'consulta-input';
  cepInput.type = 'text';
  cepInput.placeholder = 'Digite o CEP';
  cepInput.inputMode = 'numeric';
  const cepBtn = document.createElement('button');
  cepBtn.className = 'consulta-btn';
  cepBtn.style.background = '#1e88e5';
  cepBtn.textContent = 'Buscar';

  cepBtn.addEventListener('click', async () => {
    const cep = cepInput.value.replace(/\D/g, '');
    if (cep.length !== 8) { showToast('CEP inválido (8 dígitos)', 'err'); return; }
    cepBtn.disabled = true; cepBtn.textContent = '...';
    try {
      const r = await fetch('/cep/' + cep);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      const fmt = cep.substring(0,5) + '-' + cep.substring(5);
      const txt = [d.logradouro + ', número __', d.bairro, 'CEP - ' + fmt, d.localidade + '/' + d.uf].filter(Boolean).join(' - ');
      await navigator.clipboard.writeText(txt);
      showToast('✓ Endereço copiado!', 'ok');
      cepBtn.textContent = 'COPIADO';
      cepBtn.style.background = '#22c55e';
    } catch(e) {
      showToast('✗ ' + e.message, 'err');
      cepBtn.style.background = '#ef4444';
      cepBtn.textContent = 'FALHA';
    } finally {
      cepBtn.disabled = false;
      setTimeout(() => { cepBtn.textContent = 'Buscar'; cepBtn.style.background = '#1e88e5'; }, 3000);
    }
  });

  cepRow.appendChild(cepLabel);
  cepRow.appendChild(cepInput);
  cepRow.appendChild(cepBtn);
  body.appendChild(cepRow);

  sec.appendChild(hdr);
  sec.appendChild(body);
  main.appendChild(sec);
}

// ─────────────────────────────────────────────
// Tabs de perfil
// ─────────────────────────────────────────────
function renderPerfisBar() {
  const bar = document.getElementById('perfis-bar');
  bar.innerHTML = '';
  for (const [key, perfil] of Object.entries(PERFIS)) {
    const tab = document.createElement('button');
    tab.className = 'perfil-tab' + (key === perfilAtivo ? ' active' : '');
    tab.textContent = perfil.title;
    tab.addEventListener('click', () => {
      perfilAtivo = key;
      renderPerfisBar();
      renderPerfil();
    });
    bar.appendChild(tab);
  }
}

// ─────────────────────────────────────────────
// Status do Chrome
// ─────────────────────────────────────────────
async function checkStatus() {
  const dot = document.getElementById('status-dot');
  try {
    const r = await fetch('/status');
    const d = await r.json();
    dot.className = d.ok ? 'ok' : 'err';
    dot.title = d.ok
      ? `Chrome conectado — ${d.pages?.length || 0} aba(s)`
      : `Desconectado: ${d.error}`;
  } catch(e) {
    dot.className = 'err';
    dot.title = 'Servidor offline';
  }
}

setInterval(checkStatus, 5000);
checkStatus();

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
renderPerfisBar();
renderPerfil();
</script>
</body>
</html>
