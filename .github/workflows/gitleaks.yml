name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # toda segunda 03:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historia completa p/ varredura de commits novos
      - name: gitleaks (historico + diff)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O action acima ja falha o job se achar segredo.
      # Relatorio SARIF extra para a aba Security:
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: dir scan (working tree) -> SARIF
        run: |
          gitleaks dir --config .gitleaks.toml \
            --report-format sarif --report-path gitleaks-dir.sarif \
            --redact --no-banner .
        continue-on-error: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-dir.sarif
        continue-on-error: true
