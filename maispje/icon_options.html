<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <title>Opções rápidas maisPJE</title>
        <link rel="stylesheet" href="../maisPje_icones.css">
        <style>

			body{
				margin: 0px;
				font-family: "Helvetica Neue",Helvetica,Arial,sans-serif;
				font-size: 12px;
				color: #545454;
				background-color: #f2f2f2;
				overflow: hidden;
			}

            h2 {
                font-size: 1.1em;
                margin: 0;
                padding-top: 6px;
            }

			.categorias{
				border-bottom: 1px solid #e1ddd8;
				display: flex;
				align-items: center;
				justify-content: left;
                flex-direction: column;
			}

			.categorias ul {
				margin-top: 5px;
				margin-bottom: 10px;
				list-style: none;
				padding-left: 3px;
			}

			.categorias li {
				text-align: left;
				width: 180px;
			}

			.logo {
				font-family: fantasy;
				font-weight: bold;
				font-size: 16px;
				font-variant: small-caps;
				display: flex;
				align-items: flex-start;
				color: #3d3f3f;
			}

			#versao {
				font-size: 12px;
			}

			#menu {
				cursor: pointer;
				position: relative;
				left: 2px;
				top: 2px;
				font-size: 14px;
			}

			.atalhos {

			}

			.atalhos li {
				display: flex;
				padding: 5px 10px;
				background-image: linear-gradient(to right, #f7f7f7 , #e0e0e0);
				border: 1px solid #f2f2f2;
				border-top-left-radius: 15px;
				border-bottom-left-radius: 15px;
				margin-top:-1px;
				margin-left:-1px;
				box-shadow: rgba(0, 0, 0, 0.2) 0px 2px 1px -1px, rgba(0, 0, 0, 0.14) 0px 1px 1px 0px, rgba(0, 0, 0, 0.12) 0px 1px 3px 0px;
			}

			.atalhos li:hover {
				/* background: lightgrey;				 */
				background: #2195f348;
				cursor: pointer;
			}

			a {
				color: #545454;
				text-align: center;
				margin-bottom: 1px;
				display: inline-block;
				width: 100%;
				height:	100%;
			}

			a:link, a:visited {
				text-decoration: none
			}

			a:hover {
				text-decoration: none;
			}

			a:active {
				text-decoration: none
			}

			.switch {
				position: relative;
				display: inline-block;
				width: 360px;
				height: 20px;
				margin-left: 5px;
			}

			.switch input {
				opacity: 0;
				width: 0;
				height: 0;
			}

			.switch span {
				text-align: center;
				line-height: 1.5;
			}

			.slider {
				position: absolute;
				cursor: pointer;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				background-color: #ccc;
				transition: .4s;
				border: 1px solid #545454;
			}

			.slider:before {
				position: absolute;
				content: "";
				height: 14px;
				width: 14px;
				left: 2px;
				bottom: 2px;
				background-color: white;
				transition: .4s;
			}

			input:checked + .slider {
				background-color: #2196F3;
			}

			input:checked + .slider:before {
				transform: translateX(340px);
			}

			.slider.round {
				border-radius: 34px;
			}

			.slider.round:before {
				border-radius: 50%;
			}

        </style>
    </head>

    <body>
        <section class="categorias" style="margin-top: 5px; height: 30px; flex-direction: row;">
            <div class="logo" style="width: 22px; padding-bottom: 2px;"><i class="icone box-open t20"></i></div>
            <div class="logo">
                <span style="padding: 0 2px 0 0;"><i class="icone plus t12"></i></span>
                <span>
                    <img
                        alt="PJE"
                        src="icons/logo-pje.png"
                        style="width: auto; height: 16px;padding-top: 2px;"
                    >
                </span>
            </div>
            <div class="logo" style="width: 100%; display: block;">
                <span id="versao" style="padding: 0 0 0 15px; float: right;">versao</span>
            </div>
        </section>
        <section style="height: 30px;">
            <label class="switch">
                <input type="checkbox" id="gigsLigarDesligar">
                <span class="slider round"></span>
            </label>
            <span id="menu" title="Configurações"><i
                    id="opcoes"
                    class="icone cog2 t25 spin"
                    style="vertical-align: middle;"
                ></i></span>
        </section>
        <div id="maisPJeContainerConfig" style="display:grid;grid-template-columns: 1fr 1fr; height: fit-content; width: 400px;">
            <div style="padding:5px; ">
                <section class="categorias">
                    <h2>DETALHES DO PROCESSO</h2>
                    <ul>
                        <li>
                            <label for="gigsAbrirGigs">
                            <input
                                type="checkbox"
                                name="gigsAbrirGigs"
                                id="gigsAbrirGigs"
                            >
                            Abrir GIGS
                            </label>
                        </li>
                        <li>
                            <label for="gigsAbrirTarefas">
                            <input
                                type="checkbox"
                                name="gigsAbrirTarefas"
                                id="gigsAbrirTarefas"
                            >
                            Abrir TAREFAS
                            </label>
                        </li>
                        <li>
                            <label for="gigsOcultarChips">
                            <input
                                type="checkbox"
                                name="gigsOcultarChips"
                                id="gigsOcultarChips"
                            >
                            Ocultar Chips</label>
                        </li>
                        <li>
                            <label for="gigsOcultarLembretes">
                            <input
                                type="checkbox"
                                name="gigsOcultarLembretes"
                                id="gigsOcultarLembretes"
                            >
                            Recolher Lembretes</label>
                        </li>
                        <li>
                            <label for="gigsTirarSomLembretes">
                            <input
                                type="checkbox"
                                name="gigsTirarSomLembretes"
                                id="gigsTirarSomLembretes"
                            >
                            Silenciar Lembretes</label>
                        </li>
                        <li>
                            <label for="gigsCriarMenu">
                            <input
                                type="checkbox"
                                name="gigsCriarMenu"
                                id="gigsCriarMenu"
                            >
                            Guardar dados processo</label>
                        </li>
                        <li style="text-align: left;margin-left:10px;padding:3px 0 0 3px;background-color:rgb(231, 231, 231);border-top-left-radius: 5px;border-top-right-radius: 5px;">
                            <label for="gigsCriarMenuGuardarNumeroProcesso"><input
                                type="checkbox"
                                name="gigsCriarMenuGuardarNumeroProcesso"
                                id="gigsCriarMenuGuardarNumeroProcesso"
                            >
                            copiar n. processo</label>
                        </li>
                        <li style="text-align: left;margin-left:10px;padding:0 0 3px 3px;background-color:rgb(231, 231, 231);border-bottom-left-radius: 5px;border-bottom-right-radius: 5px;">
                            <label for="gigsCriarMenuAbrirPainelCopiaECola"><input
                                type="checkbox"
                                name="gigsCriarMenuAbrirPainelCopiaECola"
                                id="gigsCriarMenuAbrirPainelCopiaECola"
                            >
                            Abrir Painel Copia e Cola</label>
                        </li>
                        <li style="text-align: left;padding-top: 10px;">
                            <label for="sanearAJG">
                            <input
                                type="checkbox"
                                name="sanearAJG"
                                id="sanearAJG"
                            >
                            Sanear AJG</label>
                        </li>
                        <li>
                            <label for="mapeamentoDeIDs">
                            <input
                                type="checkbox"
                                name="mapeamentoDeIDs"
                                id="mapeamentoDeIDs"
                            >
                            Mapear Ids</label>
                        </li>
                        <li>
                            <label>
                            <input
                                type="checkbox"
                                name="guiaPersonalizadaDetalhes"
                                id="guiaPersonalizadaDetalhes"
                            >
                            Guia Personalizada</label>
                        </li>
                        <li>
                            <label>
                            <input
                                type="checkbox"
                                name="ocultarPublicacoesDJEN"
                                id="ocultarPublicacoesDJEN"
                            >
                            Ocultar Publicações DJEN</label>
                        </li>
                        <li>
                            <label>
                            <input
                                type="checkbox"
                                name="ocultarDocumentosExcluidos"
                                id="ocultarDocumentosExcluidos"
                            >
                            Ocultar Doctos Excluídos</label>
                        </li>
                            <li>
                            <label>
                            <input
                                type="checkbox"
                                name="exibirFaseProcessualNaTimeline"
                                id="exibirFaseProcessualNaTimeline"
                            >
                                Exibir Fase na Timeline
                            </label>
                        </li>
                        <li>
                            <label>
                            <input
                                type="checkbox"
                                name="exibirBotoesCopiaIdTimeline"
                                id="exibirBotoesCopiaIdTimeline"
                            >
                                Exibir botões para copiar ID dos documentos na Timeline
                            </label>
                        </li>
                        <li style="padding-top: 7px; width: 100%;">
                            <fieldset style="border: 1px solid #ccc; border-radius: 8px;">
                                <legend style="padding: 0 5px; font-weight: bold; font-size: 0.9em; color: #3d3f3f;">
                                    APRECIAR PETIÇÕES
                                </legend>
                                <ul style="list-style: none; padding: 0; margin: 0; text-align: left;">
                                    <li>
                                        <label>
                                            <input type="checkbox" name="gigsApreciarPeticoes" id="gigsApreciarPeticoes">
                                            ao abrir detalhes
                                        </label>
                                    </li>
                                    <li>
                                        <label>
                                            <input type="checkbox" name="gigsApreciarPeticoes2" id="gigsApreciarPeticoes2">
                                            na AA Despacho
                                        </label>
                                    </li>
                                    <li>
                                        <label>
                                            <input type="checkbox" name="gigsApreciarPeticoes3" id="gigsApreciarPeticoes3">
                                            na AA Movimentações
                                        </label>
                                    </li>
                                </ul>
                            </fieldset>
                        </li>
                    </ul>
                </section>
                <section class="categorias" style="height: fit-content;border: none;">
                    <h2>TAREFAS DO PROCESSO</h2>
                    <ul>
                        <li>
                            <label>
                            <input
                                type="checkbox"
                                name="gigsAbrirDetalhes"
                                id="gigsAbrirDetalhes"
                            >
                                Abrir DETALHES
                            </label>
                        </li>
                    </ul>
                </section>
            </div>
            <div>
                <section class="categorias" style="border: none;overflow-x: hidden; max-height: 90vh; overflow-y: auto;">
                    <h2>ATALHOS</h2>
                    <ul
                        id="atalhosPlugin"
                        class="atalhos"
                        style="overflow-y: visible;overflow-x: hidden; margin:0;"
                    >
                    </ul>
                </section>
            </div>
        </div>
        <script src="comum/item-checkbox-menu.js"></script>
        <script src="icon_options.js"></script>
        <script src="../comum/preferencias.js"></script>
    </body>
</html>
