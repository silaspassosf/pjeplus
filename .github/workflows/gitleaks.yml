name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # toda segunda 03:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # historico reiniciado (commit raiz); depth 0 quebra pos-rewrite
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resultado no job summary ("No leaks detected" / falha se achar segredo).
      # Upload SARIF p/ aba Security REMOVIDO (22/09): exige billing ativo do CodeQL
      # (conta bloqueada) e dava exit 128 no fetch-depth 0 apos reescrita do historico.
      # O job summary ja atesta o resultado — aba Security fica para quando o
      # billing for regularizado.
